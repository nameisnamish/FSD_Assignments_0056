<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Family Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .error-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      max-width: 520px;
      width: 90%;
      text-align: center;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #dc3545;
      line-height: 1;
      margin-bottom: 12px;
    }
    .error-icon {
      font-size: 3.5rem;
      color: #6c757d;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="error-card">
    <div class="error-icon">
      <i class="bi bi-exclamation-triangle-fill text-warning"></i>
    </div>
    <div class="error-code">404</div>
    <h2 class="h4 mb-3 fw-bold text-dark">Resource Not Found</h2>
    <p class="text-muted mb-4" id="error-message">
      The requested User or resource does not exist or could not be found in the database.
    </p>
    <div class="d-flex justify-content-center gap-2">
      <a href="/users" class="btn btn-primary px-4 py-2">
        <i class="bi bi-people-fill me-1"></i> View All Users
      </a>
      <a href="javascript:history.back()" class="btn btn-outline-secondary px-4 py-2">
        <i class="bi bi-arrow-left me-1"></i> Go Back
      </a>
    </div>
  </div>
</body>
</html>
