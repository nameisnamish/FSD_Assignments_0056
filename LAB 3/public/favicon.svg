<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2997ff"/>
      <stop offset="100%" stop-color="#0077ed"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Glass Frame -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="8"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#glowGrad)" stroke-width="6" opacity="0.6"/>
  
  <!-- Glowing "N" Stylized Logo -->
  <path d="M140 370 V142 L340 370 V142" fill="none" stroke="url(#glowGrad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowFilter)"/>
</svg>
